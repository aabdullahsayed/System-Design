<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;">
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle fill="#ced4da" cx="2" cy="2" r="1.5"></circle>
    </pattern>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <text x="500" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#1e1e1e">Non-Relational Databases (NoSQL)</text>
  <text x="500" y="85" text-anchor="middle" font-size="16" fill="#495057">Flexible, schema-less structures optimized for specific data access patterns.</text>

  <line x1="500" y1="130" x2="500" y2="650" stroke="#dee2e6" stroke-width="3" stroke-dasharray="10,10" filter="url(#rough)"/>

  <text x="250" y="145" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b8a3e">Document Store (e.g., MongoDB)</text>

  <g filter="url(#rough)" stroke="#1e1e1e" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <rect x="60" y="180" width="380" height="340" rx="15" fill="#f4fce3" transform="rotate(-0.5 250 350)"/>
    
    <rect x="90" y="240" width="320" height="240" rx="8" fill="#ffffff" stroke="#2b8a3e" stroke-width="2"/>
    <path d="M 370 240 L 410 240 L 410 280 Z" fill="#2b8a3e"/>
  </g>

  <text x="110" y="280" font-family="monospace" font-size="15" font-weight="bold" fill="#2b8a3e">Collection: "users"</text>
  <text x="110" y="310" font-family="monospace" font-size="14" fill="#1e1e1e">{</text>
  <text x="130" y="335" font-family="monospace" font-size="14" fill="#1e1e1e">"_id": "user_99",</text>
  <text x="130" y="360" font-family="monospace" font-size="14" fill="#1e1e1e">"name": "Alice Jenkins",</text>
  <text x="130" y="385" font-family="monospace" font-size="14" fill="#c92a2a">"roles": ["admin", "editor"],</text>
  <text x="130" y="410" font-family="monospace" font-size="14" fill="#1e40af">"profile": {</text>
  <text x="150" y="435" font-family="monospace" font-size="14" fill="#1e40af">  "theme": "dark", "age": 28</text>
  <text x="130" y="460" font-family="monospace" font-size="14" fill="#1e40af">}</text>
  <text x="110" y="485" font-family="monospace" font-size="14" fill="#1e1e1e">}</text>

  <text x="250" y="560" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1e1e">How it works:</text>
  <text x="250" y="585" text-anchor="middle" font-size="14" fill="#495057">Stores complex, rich data together in a single item.</text>
  <text x="250" y="610" text-anchor="middle" font-size="14" fill="#495057">Eliminates the need for costly SQL table <tspan font-weight="bold">JOINs</tspan>.</text>
  <text x="250" y="635" text-anchor="middle" font-size="14" fill="#495057">Highly flexible—different documents can have different fields.</text>


  <text x="750" y="145" text-anchor="middle" font-size="24" font-weight="bold" fill="#e67700">Key-Value Store (e.g., Redis)</text>

  <g filter="url(#rough)" stroke="#1e1e1e" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <rect x="560" y="180" width="380" height="340" rx="15" fill="#fff9db" transform="rotate(0.5 750 350)"/>
    
    <rect x="830" y="200" width="90" height="30" rx="6" fill="#ffc9c9" stroke="#c92a2a"/>

    <rect x="590" y="255" width="320" height="55" rx="6" fill="#ffffff" stroke="#e67700"/>
    <rect x="590" y="330" width="320" height="55" rx="6" fill="#ffffff" stroke="#e67700"/>
    <rect x="590" y="405" width="320" height="55" rx="6" fill="#ffffff" stroke="#e67700"/>
    
    <path d="M 525 282 L 575 282" stroke="#d9480f" stroke-width="3" />
    <path d="M 560 272 L 580 282 L 560 292" fill="#d9480f" stroke="#d9480f"/>
  </g>

  <text x="875" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#c92a2a">IN-RAM</text>

  <text x="610" y="288" font-family="monospace" font-size="14" font-weight="bold" fill="#d9480f">"user:99:name"</text>
  <text x="770" y="288" font-family="monospace" font-size="14" fill="#495057">➔</text>
  <text x="800" y="288" font-family="monospace" font-size="14" font-weight="bold" fill="#1e1e1e">"Alice"</text>

  <text x="610" y="363" font-family="monospace" font-size="14" font-weight="bold" fill="#d9480f">"sess:token:xyz"</text>
  <text x="770" y="363" font-family="monospace" font-size="14" fill="#495057">➔</text>
  <text x="800" y="363" font-family="monospace" font-size="14" font-weight="bold" fill="#1e1e1e">"uid_123" <tspan font-size="11" fill="#c92a2a">(TTL: 1h)</tspan></text>

  <text x="610" y="438" font-family="monospace" font-size="14" font-weight="bold" fill="#d9480f">"site:views"</text>
  <text x="770" y="438" font-family="monospace" font-size="14" fill="#495057">➔</text>
  <text x="800" y="438" font-family="monospace" font-size="14" font-weight="bold" fill="#1e1e1e">450233</text>

  <text x="520" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#d9480f">O(1) Query</text>

  <text x="750" y="560" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1e1e">How it works:</text>
  <text x="750" y="585" text-anchor="middle" font-size="14" fill="#495057">Acts like a massive, distributed hash map wrapper.</text>
  <text x="750" y="610" text-anchor="middle" font-size="14" fill="#495057">Bypasses slow disk writes entirely by storing datasets in memory.</text>
  <text x="750" y="635" text-anchor="middle" font-size="14" fill="#495057">Perfect for sub-millisecond use cases like caching and sessions.</text>

  <text x="500" y="690" text-anchor="middle" font-size="14" font-style="italic" fill="#adb5bd">"MongoDB packs your entire suitcase together in one place. Redis leaves items on top of the counter for instant access."</text>

</svg>
